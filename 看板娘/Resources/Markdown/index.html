<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="katex.min.css">
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
    body { color: #242529; font: 14px/1.55 -apple-system, BlinkMacSystemFont, sans-serif; overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) { body { color: #f2f2f4; } }
    #content > :first-child { margin-top: 0; }
    #content > :last-child { margin-bottom: 0; }
    p, ul, ol, blockquote, pre, table { margin: 0 0 12px; }
    h1, h2, h3, h4, h5, h6 { line-height: 1.3; margin: 18px 0 9px; }
    h1 { font-size: 1.45em; } h2 { font-size: 1.3em; } h3 { font-size: 1.15em; }
    ul, ol { padding-left: 1.65em; } li + li { margin-top: 4px; }
    li > p { margin: 0; }
    blockquote { margin-left: 0; padding-left: 12px; border-left: 3px solid #8e8e93; color: #65666b; }
    @media (prefers-color-scheme: dark) { blockquote { color: #b6b7bd; } }
    a { color: #087bda; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    :not(pre) > code { padding: 1px 4px; border-radius: 4px; background: rgba(120, 120, 130, .12); font-size: .91em; }
    pre { overflow-x: auto; padding: 12px; border-radius: 9px; background: rgba(120, 120, 130, .10); line-height: 1.45; white-space: pre; }
    pre code { font-size: 12.5px; }
    table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; white-space: nowrap; }
    th, td { padding: 7px 10px; border: 1px solid rgba(120, 120, 130, .28); text-align: left; vertical-align: top; }
    th { background: rgba(120, 120, 130, .12); font-weight: 600; }
    hr { border: 0; border-top: 1px solid rgba(120, 120, 130, .3); margin: 14px 0; }
    .katex-display { max-width: 100%; overflow-x: auto; overflow-y: hidden; margin: 12px 0; }
    .katex { font-size: 1.04em; }
  </style>
  <script src="markdown-it.min.js"></script>
  <script src="katex.min.js"></script>
  <script src="auto-render.min.js"></script>
</head>
<body>
  <div id="content"></div>
  <script>
    const renderer = window.markdownit({ html: false, breaks: false, linkify: false, typographer: false });
    renderer.disable('image');
    const content = document.getElementById('content');
    let lastHeight = 0;

    function reportHeight() {
      requestAnimationFrame(() => {
        const height = Math.ceil(content.getBoundingClientRect().height);
        if (height !== lastHeight) {
          lastHeight = height;
          window.webkit.messageHandlers.markdownHeight.postMessage(height);
        }
      });
    }

    function protectMathDelimiters(source) {
      let fence = null;
      return source.split('\n').map(line => {
        const trimmed = line.trimStart();
        const opening = trimmed.match(/^(```|~~~)/);
        if (fence) {
          if (trimmed.startsWith(fence)) fence = null;
          return line;
        }
        if (opening) {
          fence = opening[1];
          return line;
        }
        return line.split(/(`+[^`]*`+)/g).map((part, index) =>
          index % 2 ? part : part.replace(/\\([()[\]])/g, '&#92;$1')
        ).join('');
      }).join('\n');
    }

    window.renderMarkdown = function (source) {
      content.innerHTML = renderer.render(protectMathDelimiters(source));
      renderMathInElement(content, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false },
          { left: '$', right: '$', display: false }
        ],
        throwOnError: false,
        trust: false
      });
      reportHeight();
    };

    new ResizeObserver(reportHeight).observe(content);
    document.fonts.ready.then(reportHeight);
  </script>
</body>
</html>
